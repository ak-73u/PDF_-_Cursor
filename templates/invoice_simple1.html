<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чек</title>
    <style>
        body { font-family: 'DejaVu Sans', sans-serif; margin: 40px; }
        h1 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>СЧЕТ № {{ invoice_id }}</h1>
    <p><b>Дата:</b> {{ date }}</p>
    <p><b>Клиент:</b> {{ customer_name }}</p>
    <table>
        <tr>
            <th>Товар</th>
            <th>Цена</th>
            <th>Кол-во</th>
            <th>Итого</th>
        </tr>
        <tr>
            <td>{{ product }}</td>
            <td>{{ price }} руб.</td>
            <td>{{ qty }} шт.</td>
            <td>{{ total }} руб.</td>
        </tr>
    </table>
</body>
</html>
